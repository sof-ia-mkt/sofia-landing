<svg width="500" height="360" viewBox="0 0 500 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Window frame -->
  <rect width="500" height="360" rx="16" fill="#0F0F0F"/>
  <rect x="1" y="1" width="498" height="358" rx="15" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <!-- Title bar -->
  <rect x="0" y="0" width="500" height="40" rx="16" fill="#1A1A1A"/>
  <rect x="0" y="20" width="500" height="20" fill="#1A1A1A"/>
  <circle cx="20" cy="20" r="5" fill="#5A5A5A"/>
  <circle cx="36" cy="20" r="5" fill="#7E7E7E"/>
  <circle cx="52" cy="20" r="5" fill="#D6D6D6"/>
  <text x="250" y="24" text-anchor="middle" font-family="sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">Dashboard de Reportes</text>
  <!-- Top KPI row -->
  <rect x="16" y="52" width="112" height="65" rx="10" fill="#1A1A1A"/>
  <text x="28" y="68" font-family="sans-serif" font-size="8" fill="rgba(255,255,255,0.3)">Prospectos totales</text>
  <text x="28" y="95" font-family="sans-serif" font-size="24" fill="white" font-weight="700">2,461</text>
  <text x="90" y="95" font-family="sans-serif" font-size="9" fill="#D6D6D6">↑ 32%</text>
  <rect x="138" y="52" width="112" height="65" rx="10" fill="#1A1A1A"/>
  <text x="150" y="68" font-family="sans-serif" font-size="8" fill="rgba(255,255,255,0.3)">Inscritos</text>
  <text x="150" y="95" font-family="sans-serif" font-size="24" fill="white" font-weight="700">384</text>
  <text x="200" y="95" font-family="sans-serif" font-size="9" fill="#D6D6D6">↑ 18%</text>
  <rect x="260" y="52" width="112" height="65" rx="10" fill="#1A1A1A"/>
  <text x="272" y="68" font-family="sans-serif" font-size="8" fill="rgba(255,255,255,0.3)">Tasa conversión</text>
  <text x="272" y="95" font-family="sans-serif" font-size="24" fill="white" font-weight="700">15.6%</text>
  <rect x="382" y="52" width="102" height="65" rx="10" fill="#1A1A1A"/>
  <text x="394" y="68" font-family="sans-serif" font-size="8" fill="rgba(255,255,255,0.3)">Costo/Inscrito</text>
  <text x="394" y="95" font-family="sans-serif" font-size="24" fill="#D6D6D6" font-weight="700">$285</text>
  <!-- Main chart -->
  <rect x="16" y="130" width="310" height="160" rx="12" fill="#1A1A1A"/>
  <text x="30" y="152" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.4)" font-weight="600">Prospectos por semana</text>
  <!-- Chart line path -->
  <polyline points="40,260 70,250 100,245 130,235 160,220 190,225 220,200 250,190 280,175 310,180" stroke="#9E9E9E" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="40,260 70,250 100,245 130,235 160,220 190,225 220,200 250,190 280,175 310,180 310,270 40,270" fill="url(#chartGrad)" opacity="0.3"/>
  <defs>
    <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9E9E9E"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>
  <!-- Active dot -->
  <circle cx="280" cy="175" r="5" fill="#FFFFFF"/>
  <circle cx="280" cy="175" r="8" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <!-- Tooltip -->
  <rect x="248" y="152" width="65" height="20" rx="6" fill="#FFFFFF"/>
  <text x="280" y="166" text-anchor="middle" font-family="sans-serif" font-size="9" fill="white" font-weight="600">342 leads</text>
  <!-- X axis labels -->
  <text x="40" y="282" font-family="sans-serif" font-size="7" fill="rgba(255,255,255,0.2)">Sem 1</text>
  <text x="100" y="282" font-family="sans-serif" font-size="7" fill="rgba(255,255,255,0.2)">Sem 3</text>
  <text x="160" y="282" font-family="sans-serif" font-size="7" fill="rgba(255,255,255,0.2)">Sem 5</text>
  <text x="220" y="282" font-family="sans-serif" font-size="7" fill="rgba(255,255,255,0.2)">Sem 7</text>
  <text x="280" y="282" font-family="sans-serif" font-size="7" fill="rgba(255,255,255,0.2)">Sem 9</text>
  <!-- Right panel: by career -->
  <rect x="340" y="130" width="144" height="160" rx="12" fill="#1A1A1A"/>
  <text x="354" y="152" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.4)" font-weight="600">Por carrera</text>
  <!-- Career bars -->
  <text x="354" y="174" font-family="sans-serif" font-size="8" fill="rgba(255,255,255,0.3)">Medicina</text>
  <rect x="354" y="178" width="116" height="8" rx="4" fill="rgba(255,255,255,0.06)"/>
  <rect x="354" y="178" width="100" height="8" rx="4" fill="#9E9E9E"/>
  <text x="354" y="202" font-family="sans-serif" font-size="8" fill="rgba(255,255,255,0.3)">Derecho</text>
  <rect x="354" y="206" width="116" height="8" rx="4" fill="rgba(255,255,255,0.06)"/>
  <rect x="354" y="206" width="78" height="8" rx="4" fill="rgba(255,255,255,0.7)"/>
  <text x="354" y="230" font-family="sans-serif" font-size="8" fill="rgba(255,255,255,0.3)">Psicología</text>
  <rect x="354" y="234" width="116" height="8" rx="4" fill="rgba(255,255,255,0.06)"/>
  <rect x="354" y="234" width="64" height="8" rx="4" fill="rgba(255,255,255,0.5)"/>
  <text x="354" y="258" font-family="sans-serif" font-size="8" fill="rgba(255,255,255,0.3)">Ingeniería</text>
  <rect x="354" y="262" width="116" height="8" rx="4" fill="rgba(255,255,255,0.06)"/>
  <rect x="354" y="262" width="50" height="8" rx="4" fill="rgba(255,255,255,0.35)"/>
  <!-- Bottom bar -->
  <rect x="16" y="302" width="468" height="44" rx="10" fill="#1A1A1A"/>
  <text x="30" y="322" font-family="sans-serif" font-size="9" fill="rgba(255,255,255,0.3)">Generado por IA</text>
  <text x="30" y="336" font-family="sans-serif" font-size="8" fill="rgba(255,255,255,0.15)">Recomendación: Aumentar inversión en Medicina +20% — ROI proyectado 4.8x</text>
  <rect x="400" y="312" width="70" height="24" rx="12" fill="rgba(255,255,255,0.3)"/>
  <text x="435" y="328" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#FFFFFF">Aplicar</text>
</svg>
