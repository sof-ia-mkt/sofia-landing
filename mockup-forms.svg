<svg width="500" height="360" viewBox="0 0 500 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Phone frame -->
  <rect x="150" y="10" width="200" height="340" rx="24" fill="#252244"/>
  <rect x="151" y="11" width="198" height="338" rx="23" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <!-- Notch -->
  <rect x="210" y="14" width="80" height="18" rx="9" fill="#1E1B37"/>
  <!-- Screen -->
  <rect x="158" y="38" width="184" height="295" rx="4" fill="#1A1730"/>
  <!-- Form header -->
  <rect x="170" y="50" width="120" height="8" rx="4" fill="rgba(255,255,255,0.3)"/>
  <rect x="170" y="64" width="160" height="5" rx="2.5" fill="rgba(255,255,255,0.1)"/>
  <!-- Form fields -->
  <!-- Name -->
  <text x="170" y="92" font-family="sans-serif" font-size="8" fill="rgba(255,255,255,0.3)">Nombre completo</text>
  <rect x="170" y="96" width="160" height="28" rx="8" fill="#252244"/>
  <rect x="180" y="106" width="90" height="6" rx="3" fill="rgba(255,255,255,0.15)"/>
  <!-- Email -->
  <text x="170" y="140" font-family="sans-serif" font-size="8" fill="rgba(255,255,255,0.3)">Correo electrónico</text>
  <rect x="170" y="144" width="160" height="28" rx="8" fill="#252244"/>
  <rect x="180" y="154" width="110" height="6" rx="3" fill="rgba(255,255,255,0.15)"/>
  <!-- Phone -->
  <text x="170" y="188" font-family="sans-serif" font-size="8" fill="rgba(255,255,255,0.3)">Teléfono</text>
  <rect x="170" y="192" width="160" height="28" rx="8" fill="#252244"/>
  <rect x="180" y="202" width="80" height="6" rx="3" fill="rgba(255,255,255,0.15)"/>
  <!-- Dropdown carrera -->
  <text x="170" y="236" font-family="sans-serif" font-size="8" fill="rgba(255,255,255,0.3)">Carrera de interés</text>
  <rect x="170" y="240" width="160" height="28" rx="8" fill="#252244"/>
  <rect x="180" y="250" width="70" height="6" rx="3" fill="rgba(83,74,183,0.4)"/>
  <text x="318" y="258" font-family="sans-serif" font-size="12" fill="rgba(255,255,255,0.2)">▾</text>
  <!-- Submit button -->
  <rect x="170" y="284" width="160" height="34" rx="17" fill="#534AB7"/>
  <text x="250" y="305" text-anchor="middle" font-family="sans-serif" font-size="11" fill="white" font-weight="600">Solicitar información</text>
  <!-- Decorative elements outside phone -->
  <!-- Left side notification -->
  <rect x="20" y="80" width="120" height="50" rx="12" fill="#252244"/>
  <rect x="21" y="81" width="118" height="48" rx="11" stroke="rgba(83,74,183,0.2)" stroke-width="1"/>
  <circle cx="40" cy="100" r="8" fill="rgba(40,200,64,0.2)"/>
  <text x="40" y="103" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#28C840">✓</text>
  <rect x="54" y="93" width="70" height="5" rx="2.5" fill="rgba(255,255,255,0.2)"/>
  <rect x="54" y="103" width="50" height="4" rx="2" fill="rgba(255,255,255,0.08)"/>
  <!-- Right side notification -->
  <rect x="360" y="160" width="120" height="50" rx="12" fill="#252244"/>
  <rect x="361" y="161" width="118" height="48" rx="11" stroke="rgba(83,74,183,0.2)" stroke-width="1"/>
  <circle cx="380" cy="180" r="8" fill="rgba(83,74,183,0.2)"/>
  <text x="380" y="184" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6C63FF">🔔</text>
  <rect x="394" y="173" width="65" height="5" rx="2.5" fill="rgba(255,255,255,0.2)"/>
  <rect x="394" y="183" width="45" height="4" rx="2" fill="rgba(255,255,255,0.08)"/>
  <!-- Smart tag -->
  <rect x="40" y="220" width="95" height="28" rx="14" fill="rgba(83,74,183,0.15)"/>
  <rect x="41" y="221" width="93" height="26" rx="13" stroke="rgba(83,74,183,0.3)" stroke-width="1"/>
  <text x="87" y="238" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6C63FF">IA Scoring: 92%</text>
</svg>
