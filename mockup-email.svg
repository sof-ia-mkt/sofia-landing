  <rect x="155" y="246" width="130" height="44" rx="10" fill="#252244"/>
  <text x="220" y="264" text-anchor="middle" font-family="sans-serif" font-size="8" fill="rgba(255,255,255,0.3)">EMAIL 2 — Seguimiento</text>
  <text x="220" y="278" text-anchor="middle" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.6)">Testimoniales</text>
