  <rect x="324" y="190" width="140" height="8" rx="4" fill="rgba(255,255,255,0.06)"/>
  <rect x="324" y="190" width="28" height="8" rx="4" fill="rgba(40,200,64,0.5)"/>
  <text x="430" y="198" font-family="sans-serif" font-size="9" fill="rgba(255,255,255,0.4)">18%</text>
