  <circle cx="26" cy="224" r="5" fill="#28C840"/>
  <rect x="36" y="217" width="68" height="5" rx="2.5" fill="rgba(255,255,255,0.15)"/>
  <rect x="36" y="226" width="48" height="4" rx="2" fill="rgba(255,255,255,0.08)"/>
